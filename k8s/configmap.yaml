apiVersion: v1
kind: ConfigMap
metadata:
  name: workshop-os-config
data:
  APP_NAME: "Workshop OS"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost:8000"
  APP_LOCALE: "pt_BR"
  APP_FALLBACK_LOCALE: "pt_BR"
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "warning"
  DB_CONNECTION: "pgsql"
  # Nome do Service do Postgres (k8s/postgres.yaml) — resolvido via DNS interno do cluster.
  DB_HOST: "workshop-os-postgres"
  DB_PORT: "5432"
  DB_DATABASE: "workshop_os"
  DB_USERNAME: "postgres"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  SESSION_DRIVER: "database"
  L5_SWAGGER_GENERATE_ALWAYS: "false"
  L5_SWAGGER_CONST_HOST: "http://localhost:8000"
  # Datadog APM — o tracer vem embutido na imagem (ver Dockerfile).
  DD_SERVICE: "workshop-os-api"
  DD_ENV: "dev"
  DD_VERSION: "1.0.0"
  DD_TRACE_ENABLED: "true"
  # `php artisan serve` usa a SAPI CLI, que o dd-trace ignora por padrão.
  # Sem isto o tracer carrega mas não emite span algum.
  DD_TRACE_CLI_ENABLED: "true"
  # O Agent roda como container no host, fora do cluster. 172.22.0.1 é o gateway
  # da rede docker `kind`, ou seja, como o Pod enxerga o host. Se o cluster kind
  # for recriado com outra subnet, reconfira com:
  #   docker network inspect kind --format '{{range .IPAM.Config}}{{.Gateway}} {{end}}'
  DD_AGENT_HOST: "172.22.0.1"
  DD_TRACE_AGENT_PORT: "8126"
