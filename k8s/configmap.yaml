# OS Service (Fase 4, namespace `os`). Valores sensíveis ficam no Secret
# `os-secret`, criado por 15SOAT-Fase1-kubernetes/scripts/bootstrap-secrets.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: os-config
data:
  APP_NAME: "OS Service"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost:30080"
  APP_LOCALE: "pt_BR"
  APP_FALLBACK_LOCALE: "pt_BR"
  # Logs JSON em stderr, coletados pelo Datadog (correlation_id + saga_id).
  LOG_CHANNEL: "json"
  LOG_LEVEL: "info"
  DB_CONNECTION: "pgsql"
  DB_HOST: "os-postgres"
  DB_PORT: "5432"
  DB_DATABASE: "workshop_os"
  DB_USERNAME: "postgres"
  QUEUE_CONNECTION: "database"
  CACHE_STORE: "database"
  SESSION_DRIVER: "array"
  RABBITMQ_HOST: "rabbitmq.platform.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  RABBITMQ_QUEUE: "os.inbox"
  SAGA_STEP_TIMEOUT_SECONDS: "120"
  SAGA_MAX_ATTEMPTS: "3"
  L5_SWAGGER_GENERATE_ALWAYS: "false"
  L5_SWAGGER_CONST_HOST: "http://localhost:30080"
  CLIENT_JWT_ISSUER: "15SOAT-Fase1-lambda"
  # APM local (ADR-016): dd-trace embutido na imagem envia spans no protocolo
  # Datadog para o OpenTelemetry Collector `trace-agent` (namespace platform),
  # que repassa ao Jaeger. DD_TRACE_AGENT_URL é obrigatório (o sidecar ignora
  # DD_AGENT_HOST).
  DD_SERVICE: "os-service"
  DD_ENV: "dev"
  DD_VERSION: "4.0.0"
  DD_TRACE_ENABLED: "true"
  DD_TRACE_CLI_ENABLED: "false"
  DD_LOGS_INJECTION: "true"
  DD_AGENT_HOST: "trace-agent.platform.svc.cluster.local"
  DD_TRACE_AGENT_PORT: "8126"
  DD_TRACE_AGENT_URL: "http://trace-agent.platform.svc.cluster.local:8126"
  # A integração AMQP do dd-trace rotula seus spans como "amqp", e o receptor
  # datadog do Collector rotula o lote inteiro com o serviço do span raiz (no
  # consumidor, amqp.basic.deliver): sem este mapeamento todo o trabalho do
  # consumidor apareceria como "amqp". O broker segue visível nos spans
  # amqp.basic.publish/deliver (tags messaging.rabbitmq.*).
  DD_SERVICE_MAPPING: "amqp:os-service"
