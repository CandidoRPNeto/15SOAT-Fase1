# ClusterIP porque quem recebe o tráfego externo agora é o Traefik
# (k8s/traefik.yaml), que assumiu o nodePort 30080 — o único mapeado para o
# host pelo kind (infra/cluster, var.api_node_port). O caminho passou a ser
# `http://localhost:30080` → Traefik → este Service → Pods.
#
# Acesso direto, sem passar pelo gateway (útil para isolar se um problema é
# da aplicação ou do roteamento):
#   kubectl port-forward svc/workshop-os-app 8000:8000
apiVersion: v1
kind: Service
metadata:
  name: workshop-os-app
spec:
  type: ClusterIP
  selector:
    app: workshop-os-app
  ports:
    - port: 8000
      targetPort: 8000
